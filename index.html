<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descubra seu Signo Zodiacal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg border-0 zodiac-card">
                    <div class="card-body p-5 text-center">
                        <h1 class="mb-4 display-5 fw-bold text-primary">✨ Descubra seu Signo</h1>
                        <p class="lead text-muted mb-4">Insira sua data de nascimento para conhecer as principais características do seu signo zodiacal.</p>
                        
                        <form id="formSigno" action="resultado.html" method="get">
                            <div class="mb-4">
                                <label for="dataNasc" class="form-label fw-semibold">Data de Nascimento</label>
                                <input type="date" class="form-control form-control-lg" id="dataNasc" name="data" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill">
                                Descobrir meu Signo
                            </button>
                        </form>
                        
                        <p class="mt-4 small text-muted">Apenas o signo solar será calculado com base na data informada.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
