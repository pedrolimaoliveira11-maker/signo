<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signos Zodiacais - Descubra e Compatibilidade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .zodiac-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            color: #212529;
        }
        .signo-simbolo {
            font-size: 5rem;
            line-height: 1;
        }
        .btn-primary {
            background: linear-gradient(45deg, #6a11cb, #2575fc);
            border: none;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(106, 17, 203, 0.4);
        }
        .nav-pills .nav-link.active {
            background: linear-gradient(45deg, #6a11cb, #2575fc);
        }
        .nav-pills .nav-link {
            color: #6a11cb;
        }
        .progress {
            height: 28px;
            border-radius: 14px;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0 zodiac-card">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="text-center mb-4 display-5 fw-bold text-primary">✨ Signos Zodiacais</h1>

                        <ul class="nav nav-pills justify-content-center mb-4" id="pills-tab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active rounded-pill mx-1" id="pills-signo-tab" data-bs-toggle="pill" data-bs-target="#pills-signo" type="button">Descobrir meu Signo</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link rounded-pill mx-1" id="pills-compat-tab" data-bs-toggle="pill" data-bs-target="#pills-compat" type="button">Compatibilidade</button>
                            </li>
                        </ul>

                        <div class="tab-content">
                            <!-- Aba Descobrir Signo -->
                            <div class="tab-pane fade show active" id="pills-signo">
                                <form id="formSigno" class="mb-4">
                                    <div class="mb-3">
                                        <label for="dataNasc" class="form-label fw-semibold">Data de Nascimento</label>
                                        <input type="date" class="form-control form-control-lg" id="dataNasc" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill">Descobrir meu Signo</button>
                                </form>
                                <div id="resultadoSigno"></div>
                            </div>

                            <!-- Aba Compatibilidade -->
                            <div class="tab-pane fade" id="pills-compat">
                                <form id="formCompat" class="mb-4">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label fw-semibold">Primeiro Signo</label>
                                            <select class="form-select form-select-lg" id="signo1" required>
                                                <option value="">Selecione...</option>
                                                <option value="aries">Áries ♈</option>
                                                <option value="touro">Touro ♉</option>
                                                <option value="gemeos">Gêmeos ♊</option>
                                                <option value="cancer">Câncer ♋</option>
                                                <option value="leao">Leão ♌</option>
                                                <option value="virgem">Virgem ♍</option>
                                                <option value="libra">Libra ♎</option>
                                                <option value="escorpiao">Escorpião ♏</option>
                                                <option value="sagitario">Sagitário ♐</option>
                                                <option value="capricornio">Capricórnio ♑</option>
                                                <option value="aquario">Aquário ♒</option>
                                                <option value="peixes">Peixes ♓</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label fw-semibold">Segundo Signo</label>
                                            <select class="form-select form-select-lg" id="signo2" required>
                                                <option value="">Selecione...</option>
                                                <option value="aries">Áries ♈</option>
                                                <option value="touro">Touro ♉</option>
                                                <option value="gemeos">Gêmeos ♊</option>
                                                <option value="cancer">Câncer ♋</option>
                                                <option value="leao">Leão ♌</option>
                                                <option value="virgem">Virgem ♍</option>
                                                <option value="libra">Libra ♎</option>
                                                <option value="escorpiao">Escorpião ♏</option>
                                                <option value="sagitario">Sagitário ♐</option>
                                                <option value="capricornio">Capricórnio ♑</option>
                                                <option value="aquario">Aquário ♒</option>
                                                <option value="peixes">Peixes ♓</option>
                                            </select>
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill">Verificar Compatibilidade</button>
                                </form>
                                <div id="resultadoCompat"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const signos = {
            aries: { nome: "Áries", simbolo: "♈", datas: "21 mar – 19 abr", elemento: "Fogo", regente: "Marte", caracteristicas: "Corajoso, energético, líder nato e pioneiro. Gosta de desafios e toma a iniciativa." },
            touro: { nome: "Touro", simbolo: "♉", datas: "20 abr – 20 mai", elemento: "Terra", regente: "Vênus", caracteristicas: "Estável, paciente, determinado e apreciador de conforto. Muito leal e persistente." },
            gemeos: { nome: "Gêmeos", simbolo: "♊", datas: "21 mai – 20 jun", elemento: "Ar", regente: "Mercúrio", caracteristicas: "Comunicativo, curioso, versátil e sociável. Adora aprender e conversar." },
            cancer: { nome: "Câncer", simbolo: "♋", datas: "21 jun – 22 jul", elemento: "Água", regente: "Lua", caracteristicas: "Emotivo, protetor, intuitivo e ligado à família. Sensível e acolhedor." },
            leao: { nome: "Leão", simbolo: "♌", datas: "23 jul – 22 ago", elemento: "Fogo", regente: "Sol", caracteristicas: "Carismático, generoso, confiante e criativo. Líder natural e generoso." },
            virgem: { nome: "Virgem", simbolo: "♍", datas: "23 ago – 22 set", elemento: "Terra", regente: "Mercúrio", caracteristicas: "Organizado, analítico, prestativo e prático. Excelente em detalhes." },
            libra: { nome: "Libra", simbolo: "♎", datas: "23 set – 22 out", elemento: "Ar", regente: "Vênus", caracteristicas: "Diplomático, equilibrado, justo e sociável. Busca harmonia." },
            escorpiao: { nome: "Escorpião", simbolo: "♏", datas: "23 out – 21 nov", elemento: "Água", regente: "Plutão", caracteristicas: "Intenso, misterioso, leal e determinado. Grande força emocional." },
            sagitario: { nome: "Sagitário", simbolo: "♐", datas: "22 nov – 21 dez", elemento: "Fogo", regente: "Júpiter", caracteristicas: "Aventureiro, otimista, sincero e independente. Ama liberdade." },
            capricornio: { nome: "Capricórnio", simbolo: "♑", datas: "22 dez – 19 jan", elemento: "Terra", regente: "Saturno", caracteristicas: "Disciplinado, responsável, ambicioso e prático. Focado em metas." },
            aquario: { nome: "Aquário", simbolo: "♒", datas: "20 jan – 18 fev", elemento: "Ar", regente: "Urano", caracteristicas: "Original, independente, inovador e amigável. Valoriza a liberdade." },
            peixes: { nome: "Peixes", simbolo: "♓", datas: "19 fev – 20 mar", elemento: "Água", regente: "Netuno", caracteristicas: "Sensível, empático, imaginativo e sonhador. Muito criativo." }
        };

        const elementos = {
            aries: "Fogo", touro: "Terra", gemeos: "Ar", cancer: "Água",
            leao: "Fogo", virgem: "Terra", libra: "Ar", escorpiao: "Água",
            sagitario: "Fogo", capricornio: "Terra", aquario: "Ar", peixes: "Água"
        };

        function calcularSigno(dataStr) {
            if (!dataStr || !dataStr.includes("-")) return null;
            const partes = dataStr.split("-");
            if (partes.length !== 3) return null;

            const mes = parseInt(partes[1], 10);
            const dia = parseInt(partes[2], 10);
            if (isNaN(mes) || isNaN(dia)) return null;

            if ((mes === 3 && dia >= 21) || (mes === 4 && dia <= 19)) return "aries";
            if ((mes === 4 && dia >= 20) || (mes === 5 && dia <= 20)) return "touro";
            if ((mes === 5 && dia >= 21) || (mes === 6 && dia <= 20)) return "gemeos";
            if ((mes === 6 && dia >= 21) || (mes === 7 && dia <= 22)) return "cancer";
            if ((mes === 7 && dia >= 23) || (mes === 8 && dia <= 22)) return "leao";
            if ((mes === 8 && dia >= 23) || (mes === 9 && dia <= 22)) return "virgem";
            if ((mes === 9 && dia >= 23) || (mes === 10 && dia <= 22)) return "libra";
            if ((mes === 10 && dia >= 23) || (mes === 11 && dia <= 21)) return "escorpiao";
            if ((mes === 11 && dia >= 22) || (mes === 12 && dia <= 21)) return "sagitario";
            if ((mes === 12 && dia >= 22) || (mes === 1 && dia <= 19)) return "capricornio";
            if ((mes === 1 && dia >= 20) || (mes === 2 && dia <= 18)) return "aquario";
            if ((mes === 2 && dia >= 19) || (mes === 3 && dia <= 20)) return "peixes";
            return null;
        }

        function getCompatibilidade(el1, el2) {
            if (el1 === el2) {
                return { pct: 90, nivel: "Excelente", desc: "Mesmo elemento! Vocês se entendem naturalmente e compartilham ritmo e valores semelhantes." };
            }
            const complementares = [["Fogo","Ar"],["Ar","Fogo"],["Terra","Água"],["Água","Terra"]];
            if (complementares.some(p => p[0] === el1 && p[1] === el2)) {
                return { pct: 80, nivel: "Muito Boa", desc: "Elementos complementares. Vocês se estimulam e se equilibram muito bem." };
            }
            return { pct: 55, nivel: "Moderada", desc: "Elementos diferentes trazem desafios e aprendizados. Com diálogo, a relação pode ser muito enriquecedora." };
        }

        document.getElementById("formSigno").addEventListener("submit", function(e) {
            e.preventDefault();
            const data = document.getElementById("dataNasc").value;
            const div = document.getElementById("resultadoSigno");

            if (!data) {
                div.innerHTML = '<div class="alert alert-warning">Por favor, informe uma data.</div>';
                return;
            }

            const chave = calcularSigno(data);
            if (!chave || !signos[chave]) {
                div.innerHTML = '<div class="alert alert-danger">Não foi possível calcular o signo. Verifique a data.</div>';
                return;
            }

            const s = signos[chave];
            div.innerHTML = `
                <div class="text-center mt-4">
                    <div class="signo-simbolo">${s.simbolo}</div>
                    <h2 class="fw-bold text-primary">${s.nome}</h2>
                    <p class="badge bg-secondary fs-6">${s.datas}</p>
                    <div class="row text-start mt-3">
                        <div class="col-6"><strong>Elemento:</strong><br><span class="badge bg-info text-dark">${s.elemento}</span></div>
                        <div class="col-6"><strong>Regente:</strong><br><span class="badge bg-warning text-dark">${s.regente}</span></div>
                    </div>
                    <div class="mt-4 p-3 bg-light rounded text-start">
                        <h5>Principais Características</h5>
                        <p class="mb-0">${s.caracteristicas}</p>
                    </div>
                </div>
            `;
        });

        document.getElementById("formCompat").addEventListener("submit", function(e) {
            e.preventDefault();
            const s1 = document.getElementById("signo1").value;
            const s2 = document.getElementById("signo2").value;
            const div = document.getElementById("resultadoCompat");

            if (!s1 || !s2) {
                div.innerHTML = '<div class="alert alert-warning">Selecione os dois signos.</div>';
                return;
            }

            const el1 = elementos[s1];
            const el2 = elementos[s2];
            const c = getCompatibilidade(el1, el2);
            const n1 = signos[s1].nome;
            const n2 = signos[s2].nome;

            div.innerHTML = `
                <div class="text-center mt-4">
                    <div class="display-5">${signos[s1].simbolo} & ${signos[s2].simbolo}</div>
                    <h3 class="fw-bold text-primary">${n1} + ${n2}</h3>
                    <div class="my-4">
                        <div class="progress">
                            <div class="progress-bar bg-success" style="width: ${c.pct}%">${c.pct}%</div>
                        </div>
                        <p class="mt-2 fw-semibold">${c.nivel}</p>
                    </div>
                    <div class="p-3 bg-light rounded text-start">
                        <p><strong>Elementos:</strong> ${el1} e ${el2}</p>
                        <p class="mb-0">${c.desc}</p>
                    </div>
                    <p class="mt-3 small text-muted">Análise baseada apenas no signo solar.</p>
                </div>
            `;
        });
    </script>
</body>
</html>
